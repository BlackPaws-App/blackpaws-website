gzip  on;
gzip_vary on;
gzip_min_length 1024;
gzip_proxied any;
gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/javascript application/octet-stream;

server {
    listen       80;
    root   /usr/share/nginx/html;

    if ($http_x_forwarded_proto = "http") {
        rewrite          ^ https://$server_name$request_uri? permanent;
    }

    location /healthcheck {
        access_log off;
        return 200;
    }

    location / {
        try_files $uri $uri/ /index.html;
        autoindex off;
    }

    location ~* \.(js|svg|woff2|glb|json|css|png|jpg|jpeg|gif|ico)$ {
        expires 1d;
        add_header Cache-Control "public";
    }

    error_page 404 /404.html;
    location = /404.html {
            root /usr/share/nginx/html;
            internal;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}